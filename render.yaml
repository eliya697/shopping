# Render Blueprint for the backend (Dashboard -> New -> Blueprint -> pick this repo).
services:
  - type: web
    name: shopping-list-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ALLOWED_ORIGINS
        value: https://eliya697.github.io
      # With a persistent disk (paid plans), point the database at it:
      # - key: DB_PATH
      #   value: /var/data/shopping.db
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
