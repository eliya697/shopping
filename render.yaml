# Render Blueprint for the backend (Dashboard -> New -> Blueprint -> pick this repo).
services:
  - type: web
    name: shopping-list-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ALLOWED_ORIGINS
        value: https://eliya697.github.io
      # Persistent database (Turso). Set the values in the Render dashboard — never commit them.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Admin dashboard (admin.html). At least 16 random characters.
      - key: ADMIN_SECRET_KEY
        sync: false
