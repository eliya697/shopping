<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Invite deep link: …/join/?code=ABCD2345
  Forwards to the app as ../?join=ABCD2345, which joins the list automatically
  (and creates an account on the spot for first-time users). The meta tags give
  WhatsApp/SMS a proper link preview.
-->
<title>הוזמנת לרשימת קניות משותפת</title>
<meta name="description" content="פתחו את הקישור כדי להצטרף לרשימת הקניות המשותפת.">
<meta property="og:title" content="🛒 הוזמנת לרשימת קניות משותפת">
<meta property="og:description" content="לחצו כדי להצטרף — הרשימה מתעדכנת אצל כולם בזמן אמת.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #121212; color: #ececec; font-family: -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #00e676; font-weight: 700; }
</style>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var code = (params.get("code") || params.get("join") || "").replace(/[^A-Za-z0-9-]/g, "");
    location.replace("../" + (code ? "?join=" + encodeURIComponent(code) : ""));
  })();
</script>
</head>
<body>
  <p>🛒 פותחים את הרשימה… <a href="../">לחצו כאן אם לא נפתח</a></p>
</body>
</html>
